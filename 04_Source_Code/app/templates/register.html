{% extends "base.html" %}
{% block content %}
  {% if uri %}
    <h1>Set up your authenticator app</h1>
    <p>Scan this URI in an authenticator app (or add it manually):</p>
    <code>{{ uri }}</code>
    <p>Secret (for testing without a phone): <code>{{ secret }}</code></p>
    <p><a href="{{ url_for('auth.login') }}">Continue to sign in</a></p>
  {% else %}
    <h1>Register</h1>
    <form method="post">
      <label>Username <input type="text" name="username" required></label>
      <label>Password <input type="password" name="password" required></label>
      <button type="submit">Register</button>
    </form>
  {% endif %}
{% endblock %}
